<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    .mermaid {
      margin: 24px 0;
      text-align: center;
      overflow-x: auto;
    }

    .mermaid svg {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body>
  <main class="container-lg px-3 my-5 markdown-body">
    {{ content }}
  </main>

  <script type="module">
    import mermaid from
      'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

    const blocks = document.querySelectorAll(
      'code.language-mermaid, .language-mermaid pre code, pre.language-mermaid > code'
    );

    for (const code of blocks) {
      const pre = code.closest('pre');
      if (!pre) continue;

      const diagram = document.createElement('div');
      diagram.className = 'mermaid';
      diagram.textContent = code.textContent;

      const wrapper = pre.closest('div.highlighter-rouge');
      (wrapper || pre).replaceWith(diagram);
    }

    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'strict'
    });

    await mermaid.run({
      querySelector: '.mermaid'
    });
  </script>
</body>
</html>
